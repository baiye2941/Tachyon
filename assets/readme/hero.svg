<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Tachyon — 高性能桌面下载器</title>
  <desc id="desc">Rust + Tauri v2 高性能桌面下载器：分片并发 · BT/HF 原生支持</desc>
  <defs>
    <linearGradient id="void" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050608"/>
      <stop offset="100%" stop-color="#0a0b0f"/>
    </linearGradient>
    <linearGradient id="vel" x1="0" y1="0" x2="1" y2="0">
