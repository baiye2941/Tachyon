<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Tachyon 下载路径</title>
  <desc id="desc">从粘贴链接到完成：probe、plan_fragments、并发下载、流式写入与校验、快照续传。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050608"/>
      <stop offset="100%" stop-color="#0a0b0f"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1200" height="280" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="280" fill="url(#bg)"/>

    <text x="48" y="48" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2">DOWNLOAD PATH</text>
    <text x="48" y="82" fill="#edeff3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700">一条真实路径，不是模拟下载</text>

    <!-- steps -->
    <g transform="translate(48 120)">
      <!-- 1 -->
      <rect width="180" height="100" rx="14" fill="#111319" stroke="#2c3038"/>
      <text x="20" y="32" fill="#35dde2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">01</text>
      <text x="20" y="58" fill="#edeff3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600">Probe</text>
      <text x="20" y="82" fill="#9aa0ac" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13">探测大小 / 能力</text>

      <path d="M192 50 h28" stroke="#2c3038" stroke-width="2"/>
      <path d="M214 44 l8 6 -8 6" fill="#35dde2"/>

      <!-- 2 -->
      <g transform="translate(228 0)">
        <rect width="180" height="100" rx="14" fill="#111319" stroke="#2c3038"/>
        <text x="20" y="32" fill="#35dde2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">02</text>
        <text x="20" y="58" fill="#edeff3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600">Plan</text>
        <text x="20" y="82" fill="#9aa0ac" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13">动态分片规划</text>
      </g>

      <path d="M420 50 h28" stroke="#2c3038" stroke-width="2"/>
      <path d="M442 44 l8 6 -8 6" fill="#35dde2"/>

      <!-- 3 -->
      <g transform="translate(456 0)">
        <rect width="200" height="100" rx="14" fill="#111319" stroke="#35dde2" stroke-width="1.5"/>
        <text x="20" y="32" fill="#35dde2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">03</text>
        <text x="20" y="58" fill="#edeff3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600">Execute</text>
        <text x="20" y="82" fill="#9aa0ac" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13">JoinSet 并发下载</text>
      </g>

      <path d="M668 50 h28" stroke="#2c3038" stroke-width="2"/>
      <path d="M690 44 l8 6 -8 6" fill="#35dde2"/>

      <!-- 4 -->
      <g transform="translate(704 0)">
        <rect width="200" height="100" rx="14" fill="#111319" stroke="#2c3038"/>
        <text x="20" y="32" fill="#14b8a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">04</text>
        <text x="20" y="58" fill="#edeff3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600">Write + Hash</text>
        <text x="20" y="82" fill="#9aa0ac" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13">流式写入与校验</text>
      </g>

      <path d="M916 50 h28" stroke="#2c3038" stroke-width="2"/>
      <path d="M938 44 l8 6 -8 6" fill="#35dde2"/>

      <!-- 5 -->
      <g transform="translate(952 0)">
        <rect width="156" height="100" rx="14" fill="#111319" stroke="#f472b6" stroke-width="1.25"/>
        <text x="18" y="32" fill="#f472b6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">05</text>
        <text x="18" y="58" fill="#edeff3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600">Resume</text>
        <text x="18" y="82" fill="#9aa0ac" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13">快照续传</text>
      </g>
    </g>
  </g>
</svg>
