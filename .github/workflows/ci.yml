name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 最小权限原则:CI 只需要 contents: read
permissions:
  contents: read

# SRE-018: 并发控制,同一分支的新推送自动取消旧运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Path filters: 纯 docs / 纯 frontend 跳过重 job，节省 billable
  changes:
    name: 变更检测
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
      # 重 rust job 是否运行: rust 变更 / workflow_dispatch / 非纯 docs&frontend
      run_rust: ${{ steps.flags.outputs.run_rust }}
      run_frontend: ${{ steps.flags.outputs.run_frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'scripts/ci/**'
              - 'deny.toml'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            frontend:
              - 'frontend/**'
            docs:
              - 'docs/**'
              - 'README.md'
              - '**/*.md'
              - '.claude/**'
      - name: 计算门禁开关
        id: flags
        shell: bash
        run: |
          set -euo pipefail
          rust="${{ steps.filter.outputs.rust }}"
          frontend="${{ steps.filter.outputs.frontend }}"
          docs="${{ steps.filter.outputs.docs }}"
          # main push / workflow_dispatch 默认全量,避免 path-filter 半绿误导 README badge
          # paths-filter 主要服务 PR 节省 billable
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "run_rust=true" >> "$GITHUB_OUTPUT"
            echo "run_frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 纯 frontend: 不跑 rust 重 job
          # 纯 docs: 不跑 rust/frontend 重 job
          # rust 或混合: 全量 rust；frontend 变更也跑 frontend
          run_rust=false
          run_frontend=false
          if [[ "$rust" == "true" ]]; then
            run_rust=true
          fi
          # 安全回退: 过滤器全 false（如仅改 .github/scripts 等未列出路径）时仍跑 rust
          if [[ "$rust" != "true" && "$frontend" != "true" && "$docs" != "true" ]]; then
            run_rust=true
          fi
          if [[ "$frontend" == "true" || "$rust" == "true" ]]; then
            run_frontend=true
          fi
          # 纯 docs: 两边都不跑
          if [[ "$docs" == "true" && "$rust" != "true" && "$frontend" != "true" ]]; then
            run_rust=false
            run_frontend=false
          fi
          echo "run_rust=$run_rust" >> "$GITHUB_OUTPUT"
          echo "run_frontend=$run_frontend" >> "$GITHUB_OUTPUT"
          echo "filters: rust=$rust frontend=$frontend docs=$docs → run_rust=$run_rust run_frontend=$run_frontend"

  fmt:
    name: 格式检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: rustfmt
          # fmt 不编译，无需 shared target
          cache-key-suffix: fmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 审计 E-02: clippy 仅 ubuntu 编译时跳过 cfg(windows) 的 winio/iocp/tokio_file,
        # Windows 优先应用的 IO 后端含大量 unsafe FFI,必须在此平台编译检查
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ubuntu-deps
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: clippy
          shared-key: ${{ runner.os }}-stable-${{ hashFiles('**/Cargo.lock') }}
          cache-key-suffix: clippy
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: 测试 (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ubuntu-deps
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          # Ubuntu stable 与 clippy/docs 共享 target；Win/mac 用各自 shared-key
          shared-key: ${{ runner.os == 'Linux' && format('ubuntu-stable-{0}', hashFiles('**/Cargo.lock')) || format('{0}-stable-{1}', runner.os, hashFiles('**/Cargo.lock')) }}
          cache-key-suffix: test
      - uses: cargo-bins/cargo-binstall@v1.21.1
      - name: 安装 cargo-nextest
        run: cargo binstall -y --force --locked cargo-nextest
      # 审计 E-04: 去掉全局 --retries 2,避免掩盖真实回归
      - name: 运行测试(nextest)
        run: cargo nextest run --all --locked

  # release-profile 崩溃一致性门禁:
  # panic_log_e2e 验证 release-only bug 地基(panic.log 落盘,windows_subsystem=windows 下 stderr 丢失);
  # os_kill_resume 验证 OS 进程级 kill + resume + blake3 校验。
  # CI test job 用 dev profile,release 行为(overflow-checks 分 crate、LTO、strip)
  # 仅在打包时隐式验证。本 job 补充 release 下的显式门禁。
  test-release:
    name: Release 崩溃一致性测试
    needs: [changes]
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ubuntu-deps
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: ${{ runner.os }}-stable-release-${{ hashFiles('**/Cargo.lock') }}
          cache-key-suffix: test-release
      - uses: cargo-bins/cargo-binstall@v1.21.1
      - name: 安装 cargo-nextest
        run: cargo binstall -y --force --locked cargo-nextest
      - name: 运行 release 崩溃一致性测试
        # 只构建两个 release 集成测试目标,避免 --all 额外编译整个 workspace 的
        # release 测试二进制,Windows runner 在 20 分钟内因编译超时被取消。
        run: cargo nextest run -p tachyon-app --test panic_log_e2e -p tachyon-engine --test os_kill_resume --release --locked

  docs:
    name: 文档构建
    needs: [changes]
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ubuntu-deps
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: ubuntu-stable-${{ hashFiles('**/Cargo.lock') }}
          cache-key-suffix: docs
      - name: 构建文档(零警告)
        run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    # MSRV 门禁:工作区声明 rust-version = "1.85",但 CI 默认用浮动 stable,
    # 依赖升级可能在不知情下破坏声明的最低支持版本。本 job 用固定 1.85 验证编译。
    # 审计 E-02: 同 clippy,需在 Windows 验证 cfg(windows) IO 后端的 MSRV 兼容
    name: MSRV (1.85, ${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ubuntu-deps
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.85"
          components: rustfmt
          # MSRV 必须独立 cache key，禁止与 stable 共享
          shared-key: ${{ runner.os }}-msrv-1.85-${{ hashFiles('**/Cargo.lock') }}
          cache-key-suffix: msrv
      - name: 验证 MSRV 编译(1.85)
        run: cargo build --all --locked --all-features

  audit:
    name: 安全审计 (cargo-deny)
    needs: [changes]
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: ubuntu-stable-${{ hashFiles('**/Cargo.lock') }}
          cache-key-suffix: audit
      - uses: cargo-bins/cargo-binstall@v1.21.1
      - name: 安装 cargo-deny (预编译二进制)
        run: cargo binstall -y --force cargo-deny
      - run: cargo deny check
      # SRE-012: 未使用依赖检查
      - name: 安装 cargo-machete
        run: cargo binstall -y --force cargo-machete
      - name: 检查未使用依赖
        run: cargo machete

  cargo-audit:
    name: Cargo Audit
    needs: [changes]
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: ubuntu-stable-${{ hashFiles('**/Cargo.lock') }}
          cache-key-suffix: cargo-audit
      - uses: cargo-bins/cargo-binstall@v1.21.1
      - name: 安装 cargo-audit (预编译二进制)
        run: cargo binstall -y --force cargo-audit
      # ignore 单源 = deny.toml [advisories].ignore（scripts/ci/audit.sh 解析）
      # 本 job 仅跑 cargo-audit；cargo deny 由 audit job 负责
      - name: cargo audit 检查
        run: bash scripts/ci/audit.sh
        env:
          AUDIT_WITH_DENY: "0"

  # SRE-013: TOML 格式检查（廉价，始终运行）
  taplo:
    name: TOML 格式检查 (taplo)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: 安装 taplo(预编译二进制)
        # cargo-binstall 回退源码编译会因 globset 依赖解析失败而报错(quickinstall 无预编译包),
        # 改用 taplo 官方 GitHub release 的预编译二进制,避免源码编译。
        run: |
          set -eu
          TAPLO_VERSION=$(curl -sSL https://api.github.com/repos/tamasfe/taplo/releases/latest | grep -oP '"tag_name":\s*"\K[^"]+')
          curl -sSL "https://github.com/tamasfe/taplo/releases/download/${TAPLO_VERSION}/taplo-linux-x86_64.gz" -o taplo.gz
          gunzip taplo.gz
          chmod +x taplo
          sudo mv taplo /usr/local/bin/taplo
          taplo --version
      - name: TOML 格式检查
        run: taplo check

  # 文档/工作流漂移检测（廉价，始终运行）
  doc-drift:
    name: 文档漂移检测
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: 检测文档与 workflow 漂移
        run: bash scripts/ci/check-doc-drift.sh

  coverage:
    name: 覆盖率检查
    needs: [changes]
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ubuntu-deps
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: llvm-tools
          # nightly 独立 key，禁止与 stable 共享
          shared-key: ubuntu-nightly-${{ hashFiles('**/Cargo.lock') }}
          cache-key-suffix: coverage
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: 运行覆盖率检查
        # SSOT: scripts/ci/coverage.sh
        # 一次 instrument + 逐 crate regions >= 90（禁止合计 fail-under-lines）
        # ignore: test_harness + 平台 IO 后端(iocp/winio/iouring)
        run: bash scripts/ci/coverage.sh
      - name: 生成覆盖率报告
        if: always()
        run: bash scripts/ci/coverage.sh
        env:
          COVERAGE_HTML_ONLY: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: target/llvm-cov/html/

  miri:
    name: Miri (unsafe 代码检测)
    needs: [changes]
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ubuntu-deps
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: miri
          shared-key: ubuntu-nightly-miri-${{ hashFiles('**/Cargo.lock') }}
          cache-key-suffix: miri
      # SSOT: scripts/ci/miri.sh（含 dir_sync isolation skip，CI/Release 同源）
      - name: Miri 检测
        run: bash scripts/ci/miri.sh

  # bench: 仅 main push 采样，不进 ci-pass 关键路径（噪声大，非正确性门禁）
  # 安全审计 P0-1/P0-3/P1-1:
  # - --save-baseline ci-baseline: 建立性能回归基线(后续 PR 可 --baseline ci-baseline 对比)
  # - throughput_baseline: 唯一支持 aria2 对标的 bench,产出 goodput/对齐命中率/rebalance 计数 JSON
  # - rebalance A/B: --rebalance-off vs 默认(on),量化动态拆片收益(AGENTS.md 要求 >10%)
  bench:
    name: 性能基准采样
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.run_rust == 'true'
    env:
      # ci 模式:Criterion 采样缩减(样本数/时间),产出绝对时间,禁止公网竞品排名
      TACHYON_BENCH_MODE: ci
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ubuntu-deps
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: ubuntu-stable-${{ hashFiles('**/Cargo.lock') }}
          cache-key-suffix: bench
      - name: 运行 Criterion 快速采样(核心 e2e 路径,保存回归基线)
        run: |
          TACHYON_BENCH_MODE=ci cargo bench --bench e2e_download -- --sample-size 10 --warm-up-time 1 --measurement-time 2 --save-baseline ci-baseline
          TACHYON_BENCH_MODE=ci cargo bench --bench e2e_http_real -- --sample-size 10 --warm-up-time 1 --measurement-time 2 --save-baseline ci-baseline
      - name: throughput_baseline 采样(goodput/对齐命中率/rebalance 计数)
        run: |
          TACHYON_BENCH_MODE=ci cargo bench --bench throughput_baseline -- --size 16MiB --runs 3 --rebalance-off 2>&1 | tee rebalance_off.txt
          TACHYON_BENCH_MODE=ci cargo bench --bench throughput_baseline -- --size 16MiB --runs 3 2>&1 | tee rebalance_on.txt
      - name: 归档性能采样结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            rebalance_off.txt
            rebalance_on.txt
          retention-days: 30

  # P0-3: PR 级性能回归门禁(信息性,不进 ci-pass 关键路径)。
  # 设计依据(AGENTS.md 教训):Windows runner 上 criterion 抖动可达 -47%~+88%,
  # 严格阻断会造成假失败,故本 job 仅信息性 —— 回归 >10% 时让 job 失败以便人工排查,
  # 但不阻断 ci-pass(不在其 needs 列表中)。
  #
  # 机制说明(criterion 0.8 行为,已核对源码):
  # - criterion 0.8 无 --threshold 标志,且任何情况下都不会因回归而 exit 非零
  #   (仅 cargo-criterion 基线/profile-time 配置错误才 exit 1)。
  # - 故本 job 用 --baseline ci-baseline 触发对比输出,再解析 criterion 的
  #   `change: [lower upper]` 区间,若 upper > 0.10(即回归 >10%)则让 job 失败。
  # - baseline 来源:actions/cache 缓存 target/criterion,key 含 base_ref,
  #   使 PR 对比的是目标分支的基线。
  # - cache-miss 降级:无基线可对比时,用 --save-baseline 建立基线供未来 PR,不失败。
  bench-regression:
    name: 性能回归检测 (信息性)
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    # 性能采样受共享 runner、网络/磁盘抖动影响,仅供人工排查,不应让正确性 CI 标红。
    # bench 不在 ci-pass needs 中,关键门禁仍由独立测试/覆盖率/安全作业负责。
    continue-on-error: true
    timeout-minutes: 30
    env:
      # ci 模式:与 bench job 一致的缩减采样
      TACHYON_BENCH_MODE: ci
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ubuntu-deps
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: ubuntu-stable-${{ hashFiles('**/Cargo.lock') }}
          cache-key-suffix: bench-regression
      # 缓存 criterion 基线:以目标分支(base_ref)为 key,PR 对比的是基线分支的性能。
      # restore-keys 提供 OS 级部分回退(命中即视为 cache hit 复用旧基线)。
      - name: 恢复 criterion 基线缓存
        id: restore-cache
        uses: actions/cache@v6
        with:
          path: target/criterion
          key: criterion-baseline-${{ runner.os }}-${{ github.base_ref }}
          restore-keys: |
            criterion-baseline-${{ runner.os }}-
      # cache HIT:读基线对比,解析回归 >10% 则失败。
      - name: 对比基线(检测 >10% 回归)
        if: steps.restore-cache.outputs.cache-hit == 'true'
        run: |
          set -uo pipefail
          # --baseline ci-baseline:读取已存基线做对比(criterion 会打印 change 区间)
          # 落盘完整输出供解析与归档
          TACHYON_BENCH_MODE=ci cargo bench --bench e2e_download -- --sample-size 10 --warm-up-time 1 --measurement-time 2 --baseline ci-baseline 2>&1 | tee bench_compare_e2e_download.txt
          TACHYON_BENCH_MODE=ci cargo bench --bench e2e_http_real -- --sample-size 10 --warm-up-time 1 --measurement-time 2 --baseline ci-baseline 2>&1 | tee bench_compare_e2e_http_real.txt
          # 解析 criterion 输出:每个 bench 的 `change: [lower point upper]` 区间,
          # upper(第 3 个数)为分数(0.10 = 10%)。任一 bench 的 upper > 0.10 视为回归超阈值。
          python3 - <<'PY'
          import re, sys, glob
          threshold = 0.10
          # criterion change 行格式: `change: [lower point_estimate upper] (p = ...)`
          pattern = re.compile(r'change:\s*\[\s*(-?[\d.]+)\s+(-?[\d.]+)\s+(-?[\d.]+)\s*\]')
          regressions = []
          files = sorted(glob.glob('bench_compare_*.txt'))
          if not files:
              print('::error::未找到 bench 对比输出文件')
              sys.exit(1)
          for f in files:
              with open(f, encoding='utf-8', errors='replace') as fh:
                  for line in fh:
                      m = pattern.search(line)
                      if not m:
                          continue
                      lower = float(m.group(1))
                      upper = float(m.group(3))
                      # 取区间上界判断最坏情况回归幅度
                      if upper > threshold:
                          regressions.append((f, upper, lower))
          if regressions:
              print('::error::检测到性能回归超过 10%% 阈值:')
              for f, upper, lower in regressions:
                  pct = upper * 100
                  print(f'  - {f}: change [{lower:.4f}, {upper:.4f}] -> {pct:.2f}% 超阈值')
              sys.exit(1)
          print('性能回归检测通过:所有 bench 回归幅度均 <= 10% 阈值')
          PY
      # cache MISS:无基线可对比,建立基线供未来 PR,不失败(信息性降级)。
      - name: 建立基线(首次,跳过对比)
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: |
          echo "::notice::首次建立 baseline,跳过对比(cache 未命中)"
          TACHYON_BENCH_MODE=ci cargo bench --bench e2e_download -- --sample-size 10 --warm-up-time 1 --measurement-time 2 --save-baseline ci-baseline
          TACHYON_BENCH_MODE=ci cargo bench --bench e2e_http_real -- --sample-size 10 --warm-up-time 1 --measurement-time 2 --save-baseline ci-baseline
      # 归档 criterion 基线目录,便于人工核查 / 未来 job 复用(30 天保留)。
      - name: 归档 criterion 基线
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-baseline
          path: target/criterion
          retention-days: 30
      # 归档对比输出文本(仅对比分支产生),便于离线复盘回归明细。
      - name: 归档对比输出
        if: always() && steps.restore-cache.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bench-regression-output
          path: bench_compare_*.txt
          retention-days: 30
          if-no-files-found: ignore

  # 安全审计 P0-2b: loom 并发不变量测试进入 CI 门禁。
  # loom_concurrency.rs(574 行)对 BufferIndexPool(iouring)和 CompletionSlots(iocp)
  # 的位图 alloc/free 做穷举线程交错验证。此前是 optional feature,CI 从不运行。
  loom:
    name: Loom 并发测试
    needs: [changes]
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ubuntu-deps
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: ubuntu-stable-${{ hashFiles('**/Cargo.lock') }}
          cache-key-suffix: loom
      - name: 运行 loom 并发不变量测试
        run: cargo test -p tachyon-io --features loom --test loom_concurrency

  frontend:
    name: 前端检查
    needs: [changes]
    if: needs.changes.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - name: 安装前端依赖
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: 前端依赖安全审计
        working-directory: frontend
        run: bun audit --audit-level=high
        # high/critical 漏洞阻断 CI；moderate 仅信息性
      - name: TypeScript 类型检查
        working-directory: frontend
        run: bun run typecheck
      - name: ESLint 检查
        working-directory: frontend
        run: bun run lint
      - name: 硬编码颜色检查
        working-directory: frontend
        run: bun run lint:colors
      - name: 前端单元测试
        working-directory: frontend
        run: bun run test
      - name: 前端构建
        working-directory: frontend
        run: bun run build

  ci-pass:
    name: CI 通过
    runs-on: ubuntu-latest
    if: always()
    # bench 已移出关键路径（main 采样保留，失败不阻断 ci-pass）
    # 审计 C2:MSRV 必须纳入汇总,否则 1.85 编译失败仍可能显示 CI 全绿
    # 安全审计 P0-2b: loom 并发测试纳入关键路径
    # skipped 视为通过：path filter 跳过的重 job 不阻断
    # 注意：needs.*.result 在 GHA 中不会展开为各 job 结果列表（会变成字面量 "Array"），
    # 必须逐个引用 needs.<job>.result，否则 failure 会被静默放过（假绿）。
    needs: [changes, fmt, clippy, test, test-release, docs, audit, cargo-audit, taplo, doc-drift, coverage, miri, loom, frontend, msrv]
    steps:
      - name: 检查所有 CI 作业是否成功
        env:
          R_CHANGES: ${{ needs.changes.result }}
          R_FMT: ${{ needs.fmt.result }}
          R_CLIPPY: ${{ needs.clippy.result }}
          R_TEST: ${{ needs.test.result }}
          R_TEST_RELEASE: ${{ needs.test-release.result }}
          R_DOCS: ${{ needs.docs.result }}
          R_AUDIT: ${{ needs.audit.result }}
          R_CARGO_AUDIT: ${{ needs.cargo-audit.result }}
          R_TAPLO: ${{ needs.taplo.result }}
          R_DOC_DRIFT: ${{ needs.doc-drift.result }}
          R_COVERAGE: ${{ needs.coverage.result }}
          R_MIRI: ${{ needs.miri.result }}
          R_LOOM: ${{ needs.loom.result }}
          R_FRONTEND: ${{ needs.frontend.result }}
          R_MSRV: ${{ needs.msrv.result }}
        run: |
          set -euo pipefail
          failed=0
          check() {
            local name="$1" result="$2"
            echo "$name=$result"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::CI 作业失败或被取消: $name=$result"
              failed=1
            fi
          }
          check changes "$R_CHANGES"
          check fmt "$R_FMT"
          check clippy "$R_CLIPPY"
          check test "$R_TEST"
          check test-release "$R_TEST_RELEASE"
          check docs "$R_DOCS"
          check audit "$R_AUDIT"
          check cargo-audit "$R_CARGO_AUDIT"
          check taplo "$R_TAPLO"
          check doc-drift "$R_DOC_DRIFT"
          check coverage "$R_COVERAGE"
          check miri "$R_MIRI"
          check loom "$R_LOOM"
          check frontend "$R_FRONTEND"
          check msrv "$R_MSRV"
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "所有 CI 作业通过（skipped 允许）"
