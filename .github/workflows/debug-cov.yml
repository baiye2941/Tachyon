name: Debug Coverage

on:
  workflow_dispatch:
  push:
    branches: [fix/io-uring-eventfd]

permissions:
  contents: read

jobs:
  cov:
    name: tachyon-io 覆盖明细
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ubuntu-deps
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: ubuntu-stable-covdiag-${{ hashFiles('Cargo.lock') }}
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: tachyon-io 覆盖率 JSON
        run: |
          cargo llvm-cov -p tachyon-io \
            --ignore-filename-regex '(test_harness|iocp|winio)' \
            --json \
            --output-path coverage-io.json
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-io-json
          path: coverage-io.json
          retention-days: 1
